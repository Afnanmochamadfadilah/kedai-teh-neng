<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan Menu - Kedai Teh Neng</title>
  <script>
    try { document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('kt3_theme') || 'light'); } catch (e) {}
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="marquee-bar"><span data-running-text></span></div>

  <nav class="navbar navbar-teh sticky-top">
    <div class="container">
      <span class="navbar-brand fw-bold mb-0" data-store-name>Kedai Teh Neng</span>
      <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
        <span class="name-badge" id="namaBadge">-</span>
        <span class="table-badge" id="layananBadge">-</span>
        <button type="button" class="btn btn-sm btn-warning" id="btnRiwayat">📜 Riwayat Saya</button>
        <button type="button" class="btn btn-sm btn-outline-light gear-btn" aria-label="Pengaturan" title="Pengaturan"><span class="gear-icon">⚙️</span></button>
        <a href="index.html" class="btn btn-sm btn-light">Keluar</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="search-box mb-3">
      <div class="input-group">
        <span class="input-group-text">🔍</span>
        <input type="search" id="searchInput" class="form-control form-control-lg" placeholder="Cari menu atau topping seblak… (contoh: ceker)" autocomplete="off">
      </div>
    </div>

    <div class="cat-scroll" id="catBar"></div>
    <div id="catalog"></div>
  </main>

  <button class="btn btn-teh cart-float fw-bold" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
    🛒 Keranjang <span class="badge bg-warning text-dark" id="cartBadge">0</span>
  </button>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartCanvas" style="width:480px; max-width:100%;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title">Keranjang &amp; Checkout</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p class="small text-secondary mb-2">Atur opsi &amp; catatan untuk setiap porsi / gelas secara terpisah.</p>
      <div id="cartItems"></div>
      <hr>
      <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
        <span>Total</span><span id="cartTotal" class="price">Rp 0</span>
      </div>

      <form id="orderForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Catatan Umum Pesanan (opsional)</label>
          <textarea id="catatan" class="form-control" rows="2" placeholder="Contoh: tolong disajikan bersamaan"></textarea>
        </div>

        <label class="form-label fw-semibold">Metode Pembayaran</label>
        <div class="alert alert-warning py-2 small d-none" id="deliveryNote">
          🛵 Pesanan Delivery wajib dibayar melalui Transfer QRIS.
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="metode" id="bayarTunai" value="tunai" checked>
          <label class="form-check-label" for="bayarTunai">Bayar Tunai di Kasir</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="metode" id="bayarQris" value="qris">
          <label class="form-check-label" for="bayarQris">Transfer QRIS</label>
        </div>

        <div id="qrisBox" class="d-none text-center border rounded p-3 mb-3">
          <p class="small mb-2">Scan QRIS berikut, lalu upload bukti transfer:</p>
          <img id="qrisImg" class="qris-img mb-2" alt="QRIS Toko">
          <div class="fw-bold mb-2">Nominal: <span id="qrisNominal" class="price"></span></div>
          <input type="file" id="buktiFile" class="form-control" accept="image/*">
          <img id="buktiPreview" class="img-fluid rounded mt-2 d-none" alt="Preview bukti">
        </div>

        <button type="submit" class="btn btn-teh w-100 btn-lg">Kirim Pesanan</button>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modalSukses" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div style="font-size:4rem">✅</div>
        <h4 class="fw-bold">Pesanan Terkirim!</h4>
        <p class="mb-1">Nomor Pesanan: <strong id="sukses-no"></strong></p>
        <p class="text-secondary" id="sukses-info"></p>
        <div class="d-grid gap-2">
          <button class="btn btn-teh" onclick="downloadReceiptPng(lastOrderId)">📥 Download Struk (Foto PNG)</button>
          <button class="btn btn-outline-teh" onclick="lihatStrukBaru()">🧾 Lihat &amp; Download / Cetak Struk</button>
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Pesan Lagi</button>
        </div>
      </div>
    </div>
  </div>

  <div class="print-only" id="receiptArea"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const namaPemesan = (params.get('nama') || '').trim();
    const waPemesan = normalizeWa(params.get('wa') || '');
    const tipeKey = params.get('tipe') || '';
    const tipeLabel = SERVICE_TYPES[tipeKey];
    const meja = (params.get('meja') || '').trim();
    const alamat = (params.get('alamat') || '').trim();
    const isDelivery = tipeKey === 'delivery';

    const dataValid = namaPemesan && validWa(waPemesan) && tipeLabel && (isDelivery ? alamat : meja);
    if (!dataValid) {
      alert('Data pemesan belum lengkap. Silakan isi form di halaman utama.');
      window.location.href = 'index.html';
    }
    document.getElementById('namaBadge').textContent = '👤 ' + namaPemesan;
    document.getElementById('layananBadge').textContent = isDelivery ? '🛵 Delivery' : (tipeLabel + ' • Meja ' + meja);

    let kategoriAktif = MENU_CATEGORIES[0];
    let buktiData = '';
    let lastOrderId = null;
    const selectedTop = new Set();

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', renderCatalog);

    document.getElementById('btnRiwayat').addEventListener('click', () => {
      openHistory({ nama: namaPemesan, kontak: waPemesan, locked: true });
    });

    function renderCategories() {
      document.getElementById('catBar').innerHTML = MENU_CATEGORIES.map(k => `
        <button class="btn btn-outline-teh ${k === kategoriAktif ? 'active' : ''}" data-kat="${esc(k)}">${esc(k)}</button>`).join('');
    }
    document.getElementById('catBar').addEventListener('click', e => {
      const b = e.target.closest('button[data-kat]');
      if (!b) return;
      kategoriAktif = b.dataset.kat;
      searchInput.value = '';
      renderCategories();
      renderCatalog();
    });

    function stokLabelHtml(m) {
      const s = getStok(m);
      if (s <= 0) return '<span class="badge bg-danger">Habis</span>';
      return `<small class="${s <= LOW_STOCK ? 'text-danger fw-semibold' : 'text-secondary'}">Stok: ${s}</small>`;
    }

    function menuGridHtml(list) {
      return '<div class="row g-3">' + list.map(m => {
        const stok = getStok(m);
        const tersisa = stokTersisa(m.id);
        const btnLabel = stok <= 0 ? 'Habis' : (tersisa <= 0 ? 'Maks. di keranjang' : '+ Tambah');
        return `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card menu-card ${stok <= 0 ? 'soldout' : ''}">
            <img src="${esc(m.foto || placeholderImg(m.nama))}" data-name="${esc(m.nama)}" alt="${esc(m.nama)}">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold mb-1">${esc(m.nama)}</h6>
              <div class="d-flex justify-content-between align-items-center">
                <small class="text-secondary">${esc(m.kategori)}</small>
                ${stokLabelHtml(m)}
              </div>
              <div class="price my-2">${rupiah(m.harga)}</div>
              <button class="btn ${tersisa <= 0 ? 'btn-secondary' : 'btn-teh'} btn-sm mt-auto" ${tersisa <= 0 ? 'disabled' : ''}
                      onclick="tambah(${m.id})">${btnLabel}</button>
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';
    }

    function toppingItemHtml(t) {
      const sel = selectedTop.has(t.id);
      const stok = getStok(t);
      const dis = stokTersisa(t.id) <= 0;
      return `
        <label class="topping-item ${sel ? 'checked' : ''} ${dis ? 'disabled' : ''}" for="tp${t.id}">
          <span class="d-flex align-items-center gap-2">
            <input type="checkbox" class="form-check-input mt-0" id="tp${t.id}" ${sel ? 'checked' : ''} ${dis ? 'disabled' : ''}
                   onchange="toggleTop(${t.id}, this.checked)">
            <span>
              <span class="d-block">${esc(t.nama)}</span>
              ${stok <= 0 ? '<span class="badge bg-danger">Habis</span>' : stokLabelHtml(t)}
            </span>
          </span>
          <small class="price">${rupiah(t.harga)}</small>
        </label>`;
    }

    function seblakTotal() {
      const all = getMenu();
      let total = getSeblakBase();
      selectedTop.forEach(id => { const t = all.find(m => m.id === id); if (t) total += t.harga; });
      return total;
    }

    function seblakFooterHtml() {
      return `
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <div class="small text-secondary">Harga 1 mangkuk seblak</div>
            <div class="fs-4 price" id="seblakHarga">${rupiah(seblakTotal())}</div>
            <div class="small text-secondary" id="seblakJumlah">${selectedTop.size} topping dipilih</div>
          </div>
          <button class="btn btn-teh btn-lg" onclick="tambahSeblak()">+ Tambah Seblak</button>
        </div>`;
    }

    function toggleTop(id, checked) {
      if (checked) selectedTop.add(id); else selectedTop.delete(id);
      const cb = document.getElementById('tp' + id);
      if (cb) cb.closest('.topping-item').classList.toggle('checked', checked);
      const h = document.getElementById('seblakHarga');
      if (h) h.textContent = rupiah(seblakTotal());
      const j = document.getElementById('seblakJumlah');
      if (j) j.textContent = selectedTop.size + ' topping dipilih';
    }

    function tambahSeblak() {
      if (!selectedTop.size) { alert('Pilih minimal satu topping seblak.'); return; }
      const err = cartAddSeblak([...selectedTop]);
      if (err) { alert(err); return; }
      selectedTop.clear();
      renderCart();
    }

    function renderSeblak(box) {
      const tops = getMenuByCategory(TOPPING_CAT);
      const groups = {};
      tops.forEach(t => { (groups[t.harga] = groups[t.harga] || []).push(t); });
      const prices = Object.keys(groups).map(Number).sort((a, b) => a - b);
      const base = getSeblakBase();
      box.innerHTML = `
        <div class="seblak-panel">
          <h5 class="fw-bold text-center mb-1">🌶️ TOPPING SEBLAK PRASMANAN</h5>
          <p class="text-center text-secondary small mb-2">
            Centang topping favoritmu, lalu tekan "Tambah Seblak". Level pedas, rasa &amp; catatan diatur di keranjang.
            ${base > 0 ? `<br>Harga dasar (bumbu &amp; kuah): <strong>${rupiah(base)}</strong>` : ''}
          </p>
          ${prices.length ? prices.map(h => `
            <div class="price-group-title">Harga ${rupiah(h)}</div>
            <div class="row g-2">
              ${groups[h].map(t => `<div class="col-6 col-md-4 col-lg-3">${toppingItemHtml(t)}</div>`).join('')}
            </div>`).join('') : '<p class="text-center text-secondary">Belum ada topping.</p>'}
          <hr>
          ${seblakFooterHtml()}
        </div>`;
    }

    function renderSearch(box, q) {
      const ql = q.toLowerCase();
      const menus = getMenu().filter(m => m.kategori !== TOPPING_CAT &&
        (m.nama.toLowerCase().includes(ql) || (ql.length >= 3 && m.kategori.toLowerCase().includes(ql))));
      const tops = getMenuByCategory(TOPPING_CAT).filter(t =>
        t.nama.toLowerCase().includes(ql) || (ql.length >= 3 && TOPPING_CAT.toLowerCase().includes(ql)));

      let html = '';
      if (menus.length) html += '<h6 class="fw-bold mb-2">Menu</h6>' + menuGridHtml(menus);
      if (tops.length) {
        html += `
          <div class="seblak-panel mt-3">
            <h6 class="fw-bold">🌶️ Topping Seblak Prasmanan</h6>
            <div class="row g-2 mb-2">
              ${tops.map(t => `<div class="col-6 col-md-4 col-lg-3">${toppingItemHtml(t)}</div>`).join('')}
            </div>
            <hr>
            ${seblakFooterHtml()}
          </div>`;
      }
      if (!menus.length && !tops.length) {
        html = `<p class="text-center text-secondary my-5">Tidak ada menu yang cocok dengan "<strong>${esc(q)}</strong>".</p>`;
      }
      box.innerHTML = html;
    }

    function renderCatalog() {
      [...selectedTop].forEach(id => { if (stokTersisa(id) <= 0) selectedTop.delete(id); });

      const box = document.getElementById('catalog');
      const q = searchInput.value.trim();
      if (q) { renderSearch(box, q); return; }
      if (kategoriAktif === SEBLAK_CAT) { renderSeblak(box); return; }
      const list = getMenuByCategory(kategoriAktif);
      box.innerHTML = list.length ? menuGridHtml(list)
        : '<p class="text-center text-secondary my-5">Belum ada menu pada kategori ini.</p>';
    }

    function tambah(id) {
      const err = cartAddMenu(id);
      if (err) alert(err);
      renderCart();
    }
    function ubah(i, d) {
      const err = cartChangeAt(i, d);
      if (err) alert(err);
      renderCart();
    }
    function setOpt(i, field, v) { cartSetOption(i, field, v); }

    function optionsHtml(list, selected) {
      return list.map(o => `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`).join('');
    }

    function notePlaceholder(c) {
      return c.isDrink
        ? 'Catatan minuman (mis: es sedikit, gula dipisah, hangat)'
        : 'Catatan makanan (mis: tanpa daun bawang, kuah banyak, jangan terlalu asin)';
    }

    function renderCart() {
      document.getElementById('cartBadge').textContent = cartCount();
      document.getElementById('cartTotal').textContent = rupiah(cartTotal());
      document.getElementById('qrisNominal').textContent = rupiah(cartTotal());
      const box = document.getElementById('cartItems');
      if (!cart.length) {
        box.innerHTML = '<p class="text-center text-secondary my-4">Keranjang masih kosong.</p>';
      } else {
        box.innerHTML = cart.map((c, i) => `
        <div class="cart-line border rounded p-2 mb-2">
          <div class="d-flex justify-content-between align-items-start">
            <div class="me-2">
              <div class="fw-semibold">${esc(c.nama)}</div>
              ${c.toppings.length ? `<small class="text-secondary d-block">${esc(c.toppings.join(', '))}</small>` : ''}
              <small class="price">${rupiah(c.harga)}</small>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button type="button" class="btn btn-outline-danger qty-btn" onclick="ubah(${i}, -1)">−</button>
              <span class="fw-bold">${c.qty}</span>
              <button type="button" class="btn btn-outline-success qty-btn" onclick="ubah(${i}, 1)">+</button>
            </div>
          </div>

          ${c.custom ? `
          <div class="row g-1 mt-1">
            <div class="col-6">
              <select class="form-select form-select-sm" onchange="setOpt(${i}, 'pedas', this.value)" aria-label="Level pedas">
                ${optionsHtml(PEDAS_OPTIONS, c.pedas)}
              </select>
            </div>
            <div class="col-6">
              <select class="form-select form-select-sm" onchange="setOpt(${i}, 'rasa', this.value)" aria-label="Rasa dan tekstur">
                ${optionsHtml(RASA_OPTIONS, c.rasa)}
              </select>
            </div>
          </div>` : ''}

          ${c.isDrink ? `
          <div class="mt-1">
            <select class="form-select form-select-sm" onchange="setOpt(${i}, 'suhu', this.value)" aria-label="Suhu minuman">
              ${SUHU_OPTIONS.map(s => `<option value="${s.v}" ${s.v === c.suhu ? 'selected' : ''}>${s.label}</option>`).join('')}
            </select>
          </div>` : ''}

          <input type="text" class="form-control form-control-sm mt-1" maxlength="80"
                 placeholder="${notePlaceholder(c)}"
                 value="${esc(c.catatan)}" oninput="setOpt(${i}, 'catatan', this.value)">
        </div>`).join('');
      }
      renderCatalog();
    }

    function updatePaymentUI() {
      const isQris = document.getElementById('bayarQris').checked;
      document.getElementById('qrisBox').classList.toggle('d-none', !isQris);
      if (isQris) document.getElementById('qrisImg').src = getQris();
    }
    document.querySelectorAll('input[name="metode"]').forEach(r => r.addEventListener('change', updatePaymentUI));

    if (isDelivery) {
      document.getElementById('bayarTunai').disabled = true;
      document.getElementById('bayarQris').checked = true;
      document.getElementById('deliveryNote').classList.remove('d-none');
    }
    updatePaymentUI();

    document.getElementById('buktiFile').addEventListener('change', function () {
      const f = this.files[0];
      if (!f) return;
      compressImage(f, 700, data => {
        buktiData = data;
        const p = document.getElementById('buktiPreview');
        p.src = data;
        p.classList.remove('d-none');
      });
    });

    document.getElementById('orderForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!cart.length) { alert('Keranjang masih kosong!'); return; }
      const metode = isDelivery ? 'qris' : document.querySelector('input[name="metode"]:checked').value;
      if (metode === 'qris' && !buktiData) {
        alert('Silakan upload foto bukti transfer QRIS.');
        return;
      }

      const res = placeOrder({
        nama: namaPemesan,
        wa: waPemesan,
        tipe: tipeLabel,
        meja: isDelivery ? '' : meja,
        alamat: isDelivery ? alamat : '',
        hp: isDelivery ? waPemesan : '',
        catatan: document.getElementById('catatan').value.trim(),
        items: cart.map(c => ({
          nama: c.nama, harga: c.harga, qty: c.qty,
          toppings: [...c.toppings],
          pedas: c.custom ? c.pedas : '',
          rasa: c.custom ? c.rasa : '',
          suhu: c.isDrink ? c.suhu : '',
          catatan: (c.catatan || '').trim()
        })),
        total: cartTotal(),
        metode: metode,
        bukti: metode === 'qris' ? buktiData : ''
      }, cart);

      if (!res.ok) { alert(res.error); renderCart(); return; }
      const order = res.order;

      lastOrderId = order.id;
      cart = []; buktiData = '';
      document.getElementById('catatan').value = '';
      document.getElementById('buktiFile').value = '';
      document.getElementById('buktiPreview').classList.add('d-none');
      renderCart();
      bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('cartCanvas')).hide();

      document.getElementById('sukses-no').textContent = '#' + String(order.no).padStart(3, '0');
      document.getElementById('sukses-info').textContent =
        isDelivery ? 'Bukti transfer diterima. Pesanan akan diantar ke alamat Anda.'
        : metode === 'tunai' ? 'Silakan lakukan pembayaran tunai di kasir. Pesanan Anda sedang diproses.'
        : 'Bukti transfer diterima. Pesanan Anda sedang diproses.';
      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSukses')).show();
    });

    function lihatStrukBaru() {
      const el = document.getElementById('modalSukses');
      el.addEventListener('hidden.bs.modal', function () {
        openHistory({ nama: namaPemesan, kontak: waPemesan, locked: true, orderId: lastOrderId });
      }, { once: true });
      bootstrap.Modal.getInstance(el).hide();
    }

    window.addEventListener('storage', function (e) {
      if (e.key === KEYS.menu) renderCart();
    });

    renderCategories();
    renderCart();
  </script>
</body>
</html>
